; PHP CLI overrides for Admin-Panel-2.2 (artisan, queue workers, scheduler)
; Install: sudo cp deploy/php/99-app-cli.ini /etc/php/8.3/cli/conf.d/99-app.ini

; db:seed loads some very large seeders -- LandingSiteSeeder is a 434 KB PHP
; file and NotificationChannelSeeder is 250 KB. 512M is not enough.
memory_limit = 1024M

; Queue workers and long imports must not be killed mid-job
max_execution_time = 0

date.timezone = UTC
