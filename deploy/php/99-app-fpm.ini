; PHP-FPM overrides for Admin-Panel-2.2
; Install: sudo cp deploy/php/99-app-fpm.ini /etc/php/8.3/fpm/conf.d/99-app.ini
;          sudo systemctl restart php8.3-fpm

memory_limit = 512M

; config/base.php allows max_file_size_kb up to 50000 (50 MB).
; Keep nginx client_max_body_size at or above post_max_size.
upload_max_filesize = 64M
post_max_size = 64M

; Excel import/export and dompdf invoice generation are slow
max_execution_time = 300
max_input_time = 300

; The admin settings forms post very large arrays
max_input_vars = 5000

expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; 0 = never stat files for changes. Fastest, but deploy.sh MUST reload php8.3-fpm
; or the server keeps serving the old code forever.
opcache.validate_timestamps = 0
; Keep comments: Laravel annotations and several packages read docblocks
opcache.save_comments = 1
