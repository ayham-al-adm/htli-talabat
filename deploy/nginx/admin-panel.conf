# nginx server block for Admin-Panel-2.2
#
# Install:
#   sudo cp deploy/nginx/admin-panel.conf /etc/nginx/sites-available/admin-panel
#   sudo ln -s /etc/nginx/sites-available/admin-panel /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is a translation of public/.htaccess, which is Apache-only. Anything
# marked "[.htaccess]" below has a direct counterpart there.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace with your domain once DNS points here (see Phase 10 / certbot).
    server_name 94.252.183.131 _;

    root /var/www/admin-panel/public;
    index index.php;
    charset utf-8;

    # config/base.php permits max_file_size_kb up to 50000 (50 MB) on some
    # uploads. Must stay >= php.ini upload_max_filesize / post_max_size.
    client_max_body_size 64M;
    client_body_timeout 300s;

    access_log /var/log/nginx/admin-panel.access.log;
    error_log  /var/log/nginx/admin-panel.error.log;

    # [.htaccess] Options -Indexes
    autoindex off;

    # [.htaccess] Redirect trailing slashes if not a folder
    location ~ ^(?<no_slash>.+)/$ {
        if (!-d $request_filename) {
            return 301 $no_slash$is_args$args;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # [.htaccess] mod_headers block.
    #
    # Static assets never enter PHP, so App\Http\Middleware\SecurityHeaders
    # cannot reach them. The .htaccess used "setifempty" so that dynamic
    # responses kept the values the middleware chose; nginx has no equivalent,
    # so these are scoped to this location ONLY. Setting them at server level
    # would send every header twice on HTML responses.
    #
    # Content-Security-Policy and Permissions-Policy are deliberately NOT set
    # here -- they govern documents, and every document is rendered by PHP.
    location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp3|mp4|pdf|zip|xlsx?|csv)$ {
        add_header X-Content-Type-Options             "nosniff" always;
        add_header X-Frame-Options                    "DENY" always;
        add_header Referrer-Policy                    "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies  "none" always;
        expires 30d;
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uncomment to stop serving the tracked Scribe API docs in public/docs/.
    # location ^~ /docs { deny all; }

    # No dotfiles (.env, .git, ...) except ACME challenges
    location ~ /\.(?!well-known) { deny all; }

    # The Firebase service-account PRIVATE KEY sits at
    # public/push-configurations/firebase.json, because AppServiceProvider.php:58
    # and FirebaseController hardcode public_path(). Under the web root it would
    # be served verbatim to anyone who asks for it. Only PHP reads it, off disk,
    # so denying HTTP access costs nothing.
    location ^~ /push-configurations/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Excel imports (maatwebsite/excel) and dompdf invoice generation are slow
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # index.php is the only executable PHP file
    location ~ \.php$ { return 404; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;
}

# NOTE: no Strict-Transport-Security here. App\Http\Middleware\SecurityHeaders
# emits it from config/security.php, but only on HTTPS requests -- so it stays
# correctly inert until certbot runs and starts working by itself afterwards
# (TrustProxies forwards X-Forwarded-Proto so Laravel sees the real scheme).
